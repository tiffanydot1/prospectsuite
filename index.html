function ProspectModal({prospect,salespeople,onClose,onUpdate}){

  const[newLog,setNewLog]=useState({category:'General',content:'',author_id:'',author_name:''});
  const[newLink,setNewLink]=useState({label:'',url:''});
  const[pitched,setPitched]=useState(Array.isArray(prospect.pitched_services)?prospect.pitched_services:(typeof prospect.pitched_services==='string'?JSON.parse(prospect.pitched_services||'[]'):[]));
  const[flash,setFlash]=useState(false);
  const[callNote,setCallNote]=useState('');
  const[fuForm,setFuForm]=useState({next_follow_up_date:'',follow_up_type:'Call',notes:'',status:'Pending'});
  const[showFU,setShowFU]=useState(false);

  const defSP=salespeople.find(s=>s.id===prospect.assigned_salesperson_id)||salespeople[0];
  useEffect(()=>{ if(defSP) setNewLog(prev=>({...prev,author_id:defSP.id,author_name:defSP.name})); },[]);
  useEffect(()=>{
    setLoading(true);
    Promise.all([
      get('log_entries',`?prospect_id=eq.${prospect.id}&order=created_at.desc`),
      get('links',`?prospect_id=eq.${prospect.id}&order=created_at.asc`)
    ]).then(([l,lk])=>{ setLogs(Array.isArray(l)?l:[]); setLinks(Array.isArray(lk)?lk:[]); setLoading(false); });
  },[prospect.id]);

  const save=async updates=>{const updated={...p,...updates};setP(updated);await upd('prospects',p.id,updates);onUpdate(updated);};
  const handleStatus=async s=>{
    await save({status:s});
    if(s==='Booked'){setFlash(true);setTimeout(()=>setFlash(false),1200);const sp=salespeople.find(x=>x.id===p.assigned_salesperson_id)||salespeople[0];await addLog('Closed Won','STATUS CHANGED TO BOOKED',sp?.name||'SYSTEM',sp?.id);}
  };
  const addLog=async(cat,content,authorName,authorId)=>{
    const entry=await ins('log_entries',{prospect_id:p.id,category:cat||newLog.category,content:content||newLog.content,author_name:authorName||newLog.author_name,author_id:authorId||newLog.author_id||null,created_at:nowISO()});
    if(entry) setLogs(prev=>[entry,...prev]);
  };
  const submitLog=async()=>{if(!newLog.content.trim())return;await addLog(newLog.category,newLog.content,newLog.author_name,newLog.author_id);setNewLog(prev=>({...prev,content:''}));};
  const submitCallNote=async()=>{if(!callNote.trim())return;await addLog('General',callNote,newLog.author_name,newLog.author_id);setCallNote('');};
  const addLink=async()=>{if(!newLink.label.trim()||!newLink.url.trim())return;const lk=await ins('links',{prospect_id:p.id,label:newLink.label.toUpperCase(),url:newLink.url,created_at:nowISO()});if(lk){setLinks(prev=>[...prev,lk]);setNewLink({label:'',url:''});}};
  const removeLink=async id=>{await del('links',id);setLinks(prev=>prev.filter(l=>l.id!==id));};
  const addFollowUp=async()=>{
    if(!fuForm.next_follow_up_date)return;
    const sp=salespeople.find(s=>s.id===p.assigned_salesperson_id);
    await ins('follow_ups',{prospect_id:p.id,prospect_name:p.business_name,salesperson_id:sp?.id,salesperson_name:sp?.name,next_follow_up_date:fuForm.next_follow_up_date,follow_up_type:fuForm.follow_up_type,status:fuForm.status,notes:fuForm.notes,created_at:nowISO(),updated_at:nowISO()});

              {STAGES.map(s=><option key={s} value={s}>{s}</option>)}

            <Card><Lbl>LINKS</Lbl><div style={{marginBottom:'12px'}}><Fi value={newLink.label} onChange={v=>setNewLink(l=>({...l,label:v.toUpperCase()}))} placeholder="LABEL (E.G. DEMO VIDEO, MOCKUP 1)"/><Fi value={newLink.url} onChange={v=>setNewLink(l=>({...l,url:v}))} placeholder="PASTE URL HERE"/><Btn onClick={addLink} full disabled={!newLink.label.trim()||!newLink.url.trim()}>SAVE LINK</Btn></div>
              {links.length===0?<div style={{fontSize:'12px',color:'#333',textTransform:'uppercase',textAlign:'center',padding:'16px'}}>NO LINKS YET</div>:<div style={{display:'flex',flexDirection:'column',gap:'8px'}}>{links.map(lk=><div key={lk.id} style={{background:'#0A0A0A',border:'1px solid #1A1A1A',borderRadius:'10px',padding:'12px'}}><div style={{fontSize:'12px',fontWeight:'800',color:'#F5F0E8',textTransform:'uppercase',marginBottom:'4px'}}>{lk.label}</div><div style={{fontSize:'11px',color:'#54A0FF',marginBottom:'8px',wordBreak:'break-all'}}>{lk.url}</div><div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}><CopyBtn text={lk.url} small/><a href={lk.url} target="_blank" rel="noreferrer" style={{background:'transparent',border:'1px solid #2A2A2A',borderRadius:'6px',padding:'5px 10px',fontSize:'11px',fontWeight:'700',color:'#888',textDecoration:'none',minHeight:'36px',display:'inline-flex',alignItems:'center',textTransform:'uppercase'}}>OPEN</a><button onClick={()=>removeLink(lk.id)} style={{background:'transparent',border:'1px solid #3A1414',borderRadius:'6px',color:'#FF6B6B',padding:'5px 10px',fontSize:'11px',cursor:'pointer',fontFamily:'inherit',minHeight:'36px',textTransform:'uppercase'}}>REMOVE</button></div></div>)}</div>}
            </Card>
          </div>}

          {tab==='log'&&<div>
            <Card style={{marginBottom:'14px'}}><Lbl>ADD TO LOG</Lbl><Fsel label="CATEGORY" value={newLog.category} onChange={v=>setNewLog(prev=>({...prev,category:v}))} opts={LOG_CATS}/>
              <div style={{marginBottom:'12px'}}><Lbl>LOGGED BY</Lbl><select value={newLog.author_id} onChange={e=>{const sp=salespeople.find(s=>s.id===e.target.value);setNewLog(prev=>({...prev,author_id:e.target.value,author_name:sp?.name||''}));}} style={{width:'100%',background:'#0A0A0A',border:'1px solid #252525',borderRadius:'8px',padding:'11px 13px',color:'#F5F0E8',fontSize:'14px',outline:'none',fontFamily:'inherit',minHeight:'44px',textTransform:'uppercase',cursor:'pointer'}}><option value=''>SELECT REP</option>{salespeople.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
              <textarea value={newLog.content} onChange={e=>setNewLog(prev=>({...prev,content:e.target.value}))} placeholder="ENTER NOTE..." rows={4} style={{width:'100%',background:'#0A0A0A',border:'1px solid #252525',borderRadius:'8px',padding:'11px 13px',color:'#F5F0E8',fontSize:'15px',outline:'none',boxSizing:'border-box',fontFamily:'inherit',resize:'vertical'}} onFocus={e=>e.target.style.borderColor=gold} onBlur={e=>e.target.style.borderColor='#252525'}/>
              <div style={{marginTop:'10px'}}><Btn onClick={submitLog} full disabled={!newLog.content.trim()}>ADD TO LOG</Btn></div>
            </Card>
            {loading?<div style={{textAlign:'center',color:'#555',padding:'32px',textTransform:'uppercase',fontSize:'12px'}}>LOADING...</div>:logs.length===0?<div style={{textAlign:'center',color:'#333',padding:'32px',textTransform:'uppercase',fontSize:'12px'}}>NO LOG ENTRIES YET</div>:
            <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>{logs.map(log=><div key={log.id} style={{background:'#0A0A0A',border:'1px solid #1A1A1A',borderRadius:'10px',padding:'13px'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'6px',gap:'8px',flexWrap:'wrap'}}><div style={{display:'flex',alignItems:'center',gap:'8px'}}><span style={{background:`${gold}18`,border:`1px solid ${gold}33`,borderRadius:'4px',padding:'2px 8px',fontSize:'9px',fontWeight:'800',color:gold,textTransform:'uppercase'}}>{log.category}</span>{log.author_name&&<span style={{fontSize:'11px',color:'#888',fontWeight:'700',textTransform:'uppercase'}}>{log.author_name}</span>}</div><span style={{fontSize:'10px',color:'#333',textTransform:'uppercase',whiteSpace:'nowrap'}}>{fmtDate(log.created_at)}</span></div><div style={{fontSize:'14px',color:'#C0B8A8',lineHeight:'1.6',whiteSpace:'pre-wrap'}}>{log.content}</div></div>)}</div>}
          </div>}

          {tab==='services'&&<Card><ServicesPicker value={pitched} onChange={async v=>{setPitched(v);await save({pitched_services:v});}}/></Card>}

          {tab==='diagnostic'&&<div>
            {diag?<div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
              {diag.prospectScore&&<div style={{background:diag.prospectScore.color==='green'?'#070E09':diag.prospectScore.color==='yellow'?'#120D06':'#120808',border:`1px solid ${SCORE_C[diag.prospectScore.color]||'#888'}33`,borderRadius:'14px',padding:'16px',position:'relative',overflow:'hidden'}}><div style={{position:'absolute',top:0,left:0,right:0,height:'3px',background:SCORE_C[diag.prospectScore.color]}}/><div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'8px'}}><ScoreBadge color={diag.prospectScore.color}/><div><Lbl color={SCORE_C[diag.prospectScore.color]}>PROSPECT SCORE</Lbl><div style={{fontSize:'14px',fontWeight:'800',textTransform:'uppercase'}}>{diag.prospectScore.headline}</div></div></div><div style={{fontSize:'13px',color:'#A0988A',paddingLeft:'48px'}}>{diag.prospectScore.reason}</div></div>}
              {diag.whatWeFound&&<Card><Lbl>WHAT WE FOUND</Lbl><div style={{fontSize:'13px',color:'#A0988A',lineHeight:'1.65'}}>{diag.whatWeFound}</div></Card>}

              {diag.prospectMessage&&<div style={{background:'#080810',border:'1px solid #1A1A35',borderRadius:'14px',padding:'16px'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}><Lbl color="#A29BFE">PROSPECT MESSAGE</Lbl><CopyBtn text={diag.prospectMessage} small/></div><div style={{fontSize:'14px',color:'#B8B0A0',lineHeight:'1.65',fontStyle:'italic'}}>"{diag.prospectMessage}"</div></div>}
            </div>:<div style={{textAlign:'center',padding:'48px 24px',color:'#333'}}><div style={{fontSize:'32px',marginBottom:'10px'}}>📋</div><div style={{fontSize:'13px',color:'#555',textTransform:'uppercase'}}>NO DIAGNOSTIC RUN YET</div></div>}

    </div>
  );
}

// ─── DASHBOARD ─────────────────────────────────────────────────
function DashboardTab({prospects,salespeople,followUps}){
  const today=todayISO();
  const total=prospects.length,newToday=prospects.filter(p=>p.created_at?.slice(0,10)===today).length;
  const fuToday=followUps.filter(f=>f.next_follow_up_date===today&&f.status==='Pending').length;
  const overdue=followUps.filter(f=>f.next_follow_up_date<today&&f.status==='Pending').length;
  const hot=prospects.filter(p=>['Interested','Appointment Offered'].includes(p.status)).length;
  const booked=prospects.filter(p=>p.status==='Booked').length;
  const rate=total>0?Math.round((booked/total)*100):0;
  const upcomingFU=followUps.filter(f=>f.status==='Pending'&&f.next_follow_up_date>=today).sort((a,b)=>a.next_follow_up_date.localeCompare(b.next_follow_up_date)).slice(0,8);
  const byStage=STAGES.map(s=>({stage:s,count:prospects.filter(p=>p.status===s).length})).filter(x=>x.count>0);
  const maxStage=Math.max(...byStage.map(x=>x.count),1);
  const StatCard=({label,value,color,sub})=><div style={{background:'#111',border:`1px solid ${color||'#1E1E1E'}33`,borderRadius:'12px',padding:'14px',flex:1,minWidth:0}}><div style={{fontSize:'10px',color:'#555',textTransform:'uppercase',letterSpacing:'1.5px',marginBottom:'6px'}}>{label}</div><div style={{fontSize:'28px',fontWeight:'800',color:color||'#F5F0E8',lineHeight:1}}>{value}</div>{sub&&<div style={{fontSize:'10px',color:'#444',marginTop:'4px',textTransform:'uppercase'}}>{sub}</div>}</div>;
  return <div style={{maxWidth:'680px',margin:'0 auto',padding:'16px 16px 80px'}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'8px'}}><StatCard label="TOTAL" value={total} color={gold}/><StatCard label="NEW TODAY" value={newToday} color="#54A0FF"/><StatCard label="BOOKED" value={booked} color="#00C48C" sub={`${rate}% RATE`}/></div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'16px'}}><StatCard label="FOLLOW-UPS TODAY" value={fuToday} color="#FF9F43"/><StatCard label="OVERDUE" value={overdue} color="#FF6B6B"/><StatCard label="HOT" value={hot} color="#A29BFE"/></div>
    <Card style={{marginBottom:'14px'}}><Lbl>PIPELINE BY STAGE</Lbl><div style={{display:'flex',flexDirection:'column',gap:'8px'}}>{byStage.map(({stage,count})=><div key={stage}><div style={{display:'flex',justifyContent:'space-between',marginBottom:'3px'}}><span style={{fontSize:'11px',color:SC[stage]||'#888',textTransform:'uppercase',fontWeight:'600'}}>{stage}</span><span style={{fontSize:'11px',color:'#888',fontWeight:'700'}}>{count}</span></div><div style={{background:'#1A1A1A',borderRadius:'4px',height:'6px',overflow:'hidden'}}><div style={{background:SC[stage]||'#888',height:'100%',width:`${(count/maxStage)*100}%`,borderRadius:'4px'}}/></div></div>)}{byStage.length===0&&<div style={{fontSize:'12px',color:'#333',textTransform:'uppercase',textAlign:'center',padding:'16px'}}>NO PROSPECTS YET</div>}</div></Card>
    {upcomingFU.length>0&&<Card><Lbl>UPCOMING FOLLOW-UPS</Lbl><div style={{display:'flex',flexDirection:'column',gap:'8px'}}>{upcomingFU.map(fu=><div key={fu.id} style={{background:'#0A0A0A',border:'1px solid #1A1A1A',borderRadius:'10px',padding:'11px 13px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:'10px'}}><div><div style={{fontSize:'13px',fontWeight:'700',textTransform:'uppercase',marginBottom:'2px'}}>{fu.prospect_name}</div><div style={{fontSize:'11px',color:'#555',textTransform:'uppercase'}}>{fu.follow_up_type} · {fu.salesperson_name}</div></div><div style={{fontSize:'11px',color:fu.next_follow_up_date===today?'#FF9F43':gold,fontWeight:'700',textTransform:'uppercase',whiteSpace:'nowrap'}}>{fu.next_follow_up_date===today?'TODAY':fu.next_follow_up_date}</div></div>)}</div></Card>}
  </div>;
}

// ─── PROSPECTS TAB ─────────────────────────────────────────────
function ProspectsTab({salespeople,onRefresh}){
  const[prospects,setProspects]=useState([]);const[loading,setLoading]=useState(true);const[selected,setSelected]=useState(null);const[search,setSearch]=useState('');const[fScore,setFScore]=useState('all');const[fStatus,setFStatus]=useState('all');const[fState,setFState]=useState('all');const[showAdd,setShowAdd]=useState(false);const[newP,setNewP]=useState({business_name:'',contact_name:'',contact_phone:'',contact_email:'',business_type:''});
  const load=async()=>{ setLoading(true); const r=await get('prospects','?order=updated_at.desc'); setProspects(Array.isArray(r)?r:[]); setLoading(false); };
  useEffect(()=>{load();},[]);
  const filtered=prospects.filter(p=>{if(fScore!=='all'&&p.score_color!==fScore)return false;if(fStatus!=='all'&&p.status!==fStatus)return false;if(fState!=='all'&&p.territory_state!==fState)return false;if(search){const q=search.toLowerCase();return(p.business_name||'').toLowerCase().includes(q)||(p.contact_name||'').toLowerCase().includes(q)||(p.territory_city||'').toLowerCase().includes(q)||(p.territory_state||'').toLowerCase().includes(q)||(p.business_type||'').toLowerCase().includes(q);}return true;});
  const addProspect=async()=>{if(!newP.business_name.trim())return;const sp=salespeople[0];const r=await ins('prospects',{business_name:newP.business_name.toUpperCase(),contact_name:(newP.contact_name||'').toUpperCase(),contact_phone:newP.contact_phone||'',contact_email:newP.contact_email||'',business_type:(newP.business_type||'').toUpperCase(),status:'New Lead',assigned_salesperson_id:sp?.id||null,pitched_services:[],created_at:nowISO(),updated_at:nowISO()});if(r){setProspects(prev=>[r,...prev]);setNewP({business_name:'',contact_name:'',contact_phone:'',contact_email:'',business_type:''});setShowAdd(false);onRefresh();}};
  const exportCSV=()=>{const hdr=['BUSINESS','TYPE','STATE','CITY','CONTACT','PHONE','EMAIL','STATUS','SCORE','REP','SERVICES','ADDED'];const rows=prospects.map(p=>{const sp=salespeople.find(s=>s.id===p.assigned_salesperson_id);return[p.business_name,p.business_type,p.territory_state,p.territory_city,p.contact_name,p.contact_phone,p.contact_email,p.status,p.score_color,sp?.name||'',(Array.isArray(p.pitched_services)?p.pitched_services:JSON.parse(p.pitched_services||'[]')).join('; '),p.created_at].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',');});const csv=[hdr.join(','),...rows].join('\n');const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`prospects-${todayISO()}.csv`;a.click();URL.revokeObjectURL(url);};
  return <div style={{maxWidth:'680px',margin:'0 auto',padding:'16px 16px 80px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px',gap:'8px'}}><div style={{fontSize:'14px',fontWeight:'800',textTransform:'uppercase'}}>PROSPECTS <span style={{fontSize:'11px',color:'#555',fontWeight:'400'}}>({prospects.length})</span></div><div style={{display:'flex',gap:'6px'}}><Btn small variant="ghost" onClick={exportCSV}>CSV</Btn><Btn small onClick={()=>setShowAdd(v=>!v)}>+ ADD</Btn></div></div>
    {showAdd&&<Card style={{marginBottom:'12px',border:'1px solid #2A2A2A'}}><Lbl>ADD PROSPECT</Lbl><Fi value={newP.business_name} onChange={v=>setNewP(p=>({...p,business_name:v}))} placeholder="BUSINESS NAME"/><Fi value={newP.contact_name} onChange={v=>setNewP(p=>({...p,contact_name:v}))} placeholder="CONTACT NAME"/><Fi value={newP.contact_phone} onChange={v=>setNewP(p=>({...p,contact_phone:v}))} placeholder="PHONE" type="tel"/><Fi value={newP.contact_email} onChange={v=>setNewP(p=>({...p,contact_email:v}))} placeholder="EMAIL" type="email"/><Fi value={newP.business_type} onChange={v=>setNewP(p=>({...p,business_type:v}))} placeholder="BUSINESS TYPE"/><div style={{display:'flex',gap:'8px'}}><Btn onClick={addProspect} full disabled={!newP.business_name.trim()}>ADD</Btn><Btn variant="ghost" onClick={()=>setShowAdd(false)} full>CANCEL</Btn></div></Card>}
    <div style={{position:'relative',marginBottom:'10px'}}><span style={{position:'absolute',left:'13px',top:'50%',transform:'translateY(-50%)',color:'#555'}}>🔍</span><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="SEARCH BUSINESSES, CONTACTS, CITIES..." style={{width:'100%',background:'#111',border:'1px solid #1E1E1E',borderRadius:'10px',padding:'12px 40px',color:'#F5F0E8',fontSize:'15px',outline:'none',boxSizing:'border-box',fontFamily:'inherit',textTransform:'uppercase',minHeight:'48px'}} onFocus={e=>e.target.style.borderColor=gold} onBlur={e=>e.target.style.borderColor='#1E1E1E'}/>{search&&<button onClick={()=>setSearch('')} style={{position:'absolute',right:'13px',top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'#555',fontSize:'18px',minWidth:'44px',minHeight:'44px'}}>×</button>}</div>
    <div style={{display:'flex',gap:'6px',overflowX:'auto',paddingBottom:'8px',marginBottom:'12px',WebkitOverflowScrolling:'touch'}}>
      {['all','green','yellow','red'].map(s=><button key={s} onClick={()=>setFScore(s)} style={{background:fScore===s?(s==='all'?'#1A1A1A':`${SCORE_C[s]}22`):'transparent',border:`1px solid ${fScore===s?(s==='all'?'#333':SCORE_C[s]+'55'):'#1E1E1E'}`,borderRadius:'6px',padding:'6px 12px',fontSize:'11px',fontWeight:'700',color:fScore===s?(s==='all'?'#C0B8A8':SCORE_C[s]):'#444',cursor:'pointer',whiteSpace:'nowrap',fontFamily:'inherit',minHeight:'36px',textTransform:'uppercase'}}>{s==='all'?'ALL SCORES':s}</button>)}
      <select value={fStatus} onChange={e=>setFStatus(e.target.value)} style={{background:'#0A0A0A',border:'1px solid #1E1E1E',borderRadius:'6px',padding:'6px 10px',color:'#888',fontSize:'11px',outline:'none',cursor:'pointer',fontFamily:'inherit',minHeight:'36px',textTransform:'uppercase'}}><option value='all'>ALL STAGES</option>{STAGES.map(s=><option key={s} value={s}>{s}</option>)}</select>
      <select value={fState} onChange={e=>setFState(e.target.value)} style={{background:'#0A0A0A',border:'1px solid #1E1E1E',borderRadius:'6px',padding:'6px 10px',color:'#888',fontSize:'11px',outline:'none',cursor:'pointer',fontFamily:'inherit',minHeight:'36px',textTransform:'uppercase'}}><option value='all'>ALL STATES</option>{Object.keys(TERR).map(s=><option key={s} value={s}>{s}</option>)}</select>
    </div>
    {loading?<div style={{textAlign:'center',color:'#555',padding:'48px',textTransform:'uppercase',fontSize:'12px'}}>LOADING...</div>:filtered.length===0?<div style={{textAlign:'center',padding:'56px 24px',color:'#333'}}><div style={{fontSize:'13px',fontWeight:'700',color:'#555',textTransform:'uppercase',marginBottom:'6px'}}>NO PROSPECTS YET</div><div style={{fontSize:'12px',textTransform:'uppercase'}}>ADD ONE OR RUN A DIAGNOSTIC AND SAVE IT.</div></div>:
    <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
      {filtered.map(p=>{const sp=salespeople.find(s=>s.id===p.assigned_salesperson_id);const pitchedArr=Array.isArray(p.pitched_services)?p.pitched_services:(typeof p.pitched_services==='string'?JSON.parse(p.pitched_services||'[]'):[]);const isBooked=p.status==='Booked';
        return <div key={p.id} onClick={()=>setSelected(p)} style={{background:isBooked?`${gold}0A`:'#111',border:isBooked?`1px solid ${gold}44`:'1px solid #1E1E1E',borderRadius:'12px',padding:'14px',cursor:'pointer'}} onMouseEnter={e=>e.currentTarget.style.borderColor=isBooked?gold:'#333'} onMouseLeave={e=>e.currentTarget.style.borderColor=isBooked?`${gold}44`:'#1E1E1E'}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'10px',marginBottom:'8px'}}><div style={{display:'flex',alignItems:'center',gap:'10px',flex:1,minWidth:0}}><ScoreBadge color={p.score_color} small/><div style={{minWidth:0}}><div style={{fontSize:'14px',fontWeight:'800',textTransform:'uppercase',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.business_name}</div><div style={{fontSize:'11px',color:'#555',textTransform:'uppercase'}}>{p.business_type||p.business_type_main}{p.territory_city?` · ${p.territory_city}`:''}{p.territory_state?` · ${p.territory_state}`:''}</div></div></div><StagePill status={p.status}/></div>
          {sp&&<div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'6px'}}><div style={{width:'18px',height:'18px',background:`${gold}22`,border:`1px solid ${gold}44`,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'8px',fontWeight:'800',color:gold,flexShrink:0}}>{sp.name[0]}</div><span style={{fontSize:'11px',fontWeight:'700',color:gold,textTransform:'uppercase'}}>{sp.name}</span></div>}
          {pitchedArr.length>0&&<div style={{display:'flex',gap:'4px',overflowX:'auto',flexWrap:'nowrap',marginBottom:'6px'}}>{pitchedArr.map(svc=><span key={svc} style={{background:`${gold}18`,border:`1px solid ${gold}33`,borderRadius:'20px',padding:'2px 8px',fontSize:'9px',color:gold,whiteSpace:'nowrap',textTransform:'uppercase'}}>{svc}</span>)}</div>}
          <div style={{fontSize:'10px',color:'#252525',textTransform:'uppercase'}}>UPDATED {fmtDate(p.updated_at)}</div>
        </div>;})}
    </div>}
    {selected&&<ProspectModal prospect={selected} salespeople={salespeople} onClose={()=>setSelected(null)} onUpdate={updated=>{setProspects(prev=>prev.map(p=>p.id===updated.id?updated:p));setSelected({...updated});onRefresh();}}/>}
  </div>;
}

// ─── SALESPEOPLE TAB ───────────────────────────────────────────
function SalespeopleTab({salespeople,setSalespeople,prospects}){
  const[selected,setSelected]=useState(null);const[showAdd,setShowAdd]=useState(false);const[newS,setNewS]=useState({name:'',email:'',phone:'',role:'',territory:''});const[editing,setEditing]=useState(null);
  const addSP=async()=>{if(!newS.name.trim())return;const r=await ins('salespeople',{name:newS.name.toUpperCase(),email:newS.email,phone:newS.phone,role:(newS.role||'').toUpperCase(),territory:(newS.territory||'').toUpperCase(),active:true,created_at:nowISO(),updated_at:nowISO()});if(r){setSalespeople(prev=>[...prev,r]);setNewS({name:'',email:'',phone:'',role:'',territory:''});setShowAdd(false);}};
  const saveSP=async()=>{if(!editing)return;await upd('salespeople',editing.id,{name:editing.name,email:editing.email,phone:editing.phone,role:editing.role,territory:editing.territory,active:editing.active});setSalespeople(prev=>prev.map(s=>s.id===editing.id?editing:s));setSelected(editing);setEditing(null);};
  const deleteSP=async id=>{if(!window.confirm('DELETE THIS SALESPERSON?'))return;await del('salespeople',id);setSalespeople(prev=>prev.filter(s=>s.id!==id));setSelected(null);};
  const getStats=sp=>({assigned:prospects.filter(p=>p.assigned_salesperson_id===sp.id).length,booked:prospects.filter(p=>p.assigned_salesperson_id===sp.id&&p.status==='Booked').length,hot:prospects.filter(p=>p.assigned_salesperson_id===sp.id&&['Interested','Appointment Offered'].includes(p.status)).length});
  if(selected){const stats=getStats(selected);const s=editing||selected;return <div style={{maxWidth:'680px',margin:'0 auto',padding:'16px 16px 80px'}}><div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'16px'}}><button onClick={()=>{setSelected(null);setEditing(null);}} style={{background:'transparent',border:'1px solid #2A2A2A',borderRadius:'7px',padding:'7px 12px',color:'#888',cursor:'pointer',fontFamily:'inherit',fontSize:'12px',minHeight:'44px',textTransform:'uppercase'}}>← BACK</button><div style={{fontSize:'16px',fontWeight:'800',textTransform:'uppercase'}}>{selected.name}</div></div><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'16px'}}>{[{l:'ASSIGNED',v:stats.assigned,c:'#54A0FF'},{l:'HOT',v:stats.hot,c:'#FF9F43'},{l:'BOOKED',v:stats.booked,c:'#00C48C'}].map(({l,v,c})=><div key={l} style={{background:'#111',border:`1px solid ${c}33`,borderRadius:'12px',padding:'14px',textAlign:'center'}}><div style={{fontSize:'10px',color:'#555',textTransform:'uppercase',marginBottom:'4px'}}>{l}</div><div style={{fontSize:'28px',fontWeight:'800',color:c}}>{v}</div></div>)}</div><Card style={{marginBottom:'12px'}}><Lbl>SALESPERSON INFO</Lbl><Fi label="NAME" value={s.name} onChange={v=>setEditing(e=>({...e,name:v.toUpperCase()}))} readOnly={!editing}/><Fi label="EMAIL" value={s.email} onChange={v=>setEditing(e=>({...e,email:v}))} placeholder="EMAIL" type="email" readOnly={!editing}/><Fi label="PHONE" value={s.phone} onChange={v=>setEditing(e=>({...e,phone:v}))} placeholder="PHONE" type="tel" readOnly={!editing}/><Fi label="ROLE" value={s.role} onChange={v=>setEditing(e=>({...e,role:v.toUpperCase()}))} placeholder="ROLE" readOnly={!editing}/><Fi label="TERRITORY" value={s.territory} onChange={v=>setEditing(e=>({...e,territory:v.toUpperCase()}))} placeholder="TERRITORY" readOnly={!editing}/></Card><div style={{display:'flex',gap:'8px'}}>{!editing?<Btn onClick={()=>setEditing({...selected})} full>EDIT</Btn>:<><Btn onClick={saveSP} full>SAVE</Btn><Btn variant="ghost" onClick={()=>setEditing(null)} full>CANCEL</Btn></>}<Btn variant="red" small onClick={()=>deleteSP(selected.id)}>DELETE</Btn></div></div>;}
  return <div style={{maxWidth:'680px',margin:'0 auto',padding:'16px 16px 80px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}><div style={{fontSize:'14px',fontWeight:'800',textTransform:'uppercase'}}>SALESPEOPLE <span style={{fontSize:'11px',color:'#555',fontWeight:'400'}}>({salespeople.length})</span></div><Btn small onClick={()=>setShowAdd(v=>!v)}>+ ADD</Btn></div>
    {showAdd&&<Card style={{marginBottom:'12px',border:'1px solid #2A2A2A'}}><Lbl>NEW SALESPERSON</Lbl><Fi value={newS.name} onChange={v=>setNewS(s=>({...s,name:v}))} placeholder="NAME"/><Fi value={newS.email} onChange={v=>setNewS(s=>({...s,email:v}))} placeholder="EMAIL" type="email"/><Fi value={newS.phone} onChange={v=>setNewS(s=>({...s,phone:v}))} placeholder="PHONE" type="tel"/><Fi value={newS.role} onChange={v=>setNewS(s=>({...s,role:v}))} placeholder="ROLE"/><Fi value={newS.territory} onChange={v=>setNewS(s=>({...s,territory:v}))} placeholder="TERRITORY OR NICHE"/><div style={{display:'flex',gap:'8px'}}><Btn onClick={addSP} full disabled={!newS.name.trim()}>ADD</Btn><Btn variant="ghost" onClick={()=>setShowAdd(false)} full>CANCEL</Btn></div></Card>}
    <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
      {salespeople.map(sp=>{const stats=getStats(sp);return <div key={sp.id} onClick={()=>setSelected(sp)} style={{background:'#111',border:'1px solid #1E1E1E',borderRadius:'12px',padding:'14px',cursor:'pointer'}} onMouseEnter={e=>e.currentTarget.style.borderColor=gold} onMouseLeave={e=>e.currentTarget.style.borderColor='#1E1E1E'}><div style={{display:'flex',alignItems:'center',gap:'12px'}}><div style={{width:'40px',height:'40px',background:`${gold}18`,border:`1px solid ${gold}33`,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'15px',fontWeight:'800',color:gold,flexShrink:0}}>{sp.name[0]}</div><div style={{flex:1}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div style={{fontSize:'14px',fontWeight:'800',textTransform:'uppercase'}}>{sp.name}</div><span style={{fontSize:'9px',fontWeight:'700',color:sp.active?'#00C48C':'#555',background:sp.active?'#00C48C18':'#1A1A1A',border:`1px solid ${sp.active?'#00C48C33':'#2A2A2A'}`,borderRadius:'4px',padding:'2px 7px',textTransform:'uppercase'}}>{sp.active?'ACTIVE':'INACTIVE'}</span></div><div style={{fontSize:'11px',color:'#555',textTransform:'uppercase',marginTop:'2px'}}>{sp.role}{sp.territory?` · ${sp.territory}`:''}</div><div style={{display:'flex',gap:'12px',marginTop:'6px'}}><span style={{fontSize:'10px',color:'#54A0FF',textTransform:'uppercase'}}>{stats.assigned} ASSIGNED</span><span style={{fontSize:'10px',color:'#FF9F43',textTransform:'uppercase'}}>{stats.hot} HOT</span><span style={{fontSize:'10px',color:'#00C48C',textTransform:'uppercase'}}>{stats.booked} BOOKED</span></div></div></div></div>;})}
      {salespeople.length===0&&<div style={{textAlign:'center',padding:'48px 24px',color:'#333'}}><div style={{fontSize:'13px',color:'#555',textTransform:'uppercase'}}>NO SALESPEOPLE YET</div></div>}
    </div>
  </div>;
}

// ─── FOLLOW-UP TRACKER ─────────────────────────────────────────
function FollowUpTab(){
  const[followUps,setFollowUps]=useState([]);const[loading,setLoading]=useState(true);const[filter,setFilter]=useState('upcoming');
  useEffect(()=>{ get('follow_ups','?order=next_follow_up_date.asc').then(r=>{setFollowUps(Array.isArray(r)?r:[]);setLoading(false);}); },[]);
  const today=todayISO();
  const filtered=followUps.filter(f=>{if(filter==='today')return f.next_follow_up_date===today&&f.status==='Pending';if(filter==='overdue')return f.next_follow_up_date<today&&f.status==='Pending';if(filter==='upcoming')return f.next_follow_up_date>=today&&f.status==='Pending';return true;});
  const updateFU=async(id,updates)=>{await upd('follow_ups',id,updates);setFollowUps(prev=>prev.map(f=>f.id===id?{...f,...updates}:f));};
  return <div style={{maxWidth:'680px',margin:'0 auto',padding:'16px 16px 80px'}}>
    <div style={{fontSize:'14px',fontWeight:'800',textTransform:'uppercase',marginBottom:'12px'}}>FOLLOW-UP TRACKER <span style={{fontSize:'11px',color:'#555',fontWeight:'400'}}>({followUps.filter(f=>f.status==='Pending').length} PENDING)</span></div>
    <div style={{display:'flex',gap:'6px',overflowX:'auto',paddingBottom:'8px',marginBottom:'14px'}}>
      {[{id:'today',label:'TODAY'},{id:'upcoming',label:'UPCOMING'},{id:'overdue',label:'OVERDUE'},{id:'all',label:'ALL'}].map(f=><button key={f.id} onClick={()=>setFilter(f.id)} style={{background:filter===f.id?(f.id==='overdue'?'#FF6B6B22':f.id==='today'?`${gold}22`:'#1A1A1A'):'transparent',border:`1px solid ${filter===f.id?(f.id==='overdue'?'#FF6B6B55':f.id==='today'?`${gold}55`:'#333'):'#1E1E1E'}`,borderRadius:'6px',padding:'6px 14px',fontSize:'11px',fontWeight:'700',color:filter===f.id?(f.id==='overdue'?'#FF6B6B':f.id==='today'?gold:'#C0B8A8'):'#444',cursor:'pointer',whiteSpace:'nowrap',fontFamily:'inherit',minHeight:'36px',textTransform:'uppercase'}}>{f.label}</button>)}
    </div>
    {loading?<div style={{textAlign:'center',color:'#555',padding:'48px',textTransform:'uppercase',fontSize:'12px'}}>LOADING...</div>:filtered.length===0?<div style={{textAlign:'center',padding:'48px',color:'#333'}}><div style={{fontSize:'13px',color:'#555',textTransform:'uppercase'}}>NO FOLLOW-UPS HERE</div><div style={{fontSize:'12px',marginTop:'8px'}}>SCHEDULE FOLLOW-UPS FROM THE CALL SHEET.</div></div>:
    <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
      {filtered.map(fu=>{const isOverdue=fu.next_follow_up_date<today&&fu.status==='Pending';const isToday=fu.next_follow_up_date===today;const accent=isOverdue?'#FF6B6B':isToday?gold:'#54A0FF';
        return <div key={fu.id} style={{background:'#111',border:`1px solid ${accent}33`,borderRadius:'12px',padding:'14px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px',gap:'10px'}}><div><div style={{fontSize:'14px',fontWeight:'800',textTransform:'uppercase',marginBottom:'2px'}}>{fu.prospect_name}</div><div style={{fontSize:'11px',color:'#555',textTransform:'uppercase'}}>{fu.salesperson_name} · {fu.follow_up_type}</div></div><div style={{textAlign:'right',flexShrink:0}}><div style={{fontSize:'12px',fontWeight:'800',color:accent,textTransform:'uppercase'}}>{isToday?'TODAY':isOverdue?'OVERDUE':fu.next_follow_up_date}</div><select value={fu.status} onChange={e=>updateFU(fu.id,{status:e.target.value})} style={{background:'transparent',border:'none',color:'#555',fontSize:'10px',outline:'none',cursor:'pointer',fontFamily:'inherit',textTransform:'uppercase',marginTop:'2px'}}>{['Pending','Completed','Cancelled'].map(s=><option key={s} value={s}>{s}</option>)}</select></div></div>
          {fu.notes&&<div style={{fontSize:'12px',color:'#888',lineHeight:'1.5',marginBottom:'8px'}}>{fu.notes}</div>}
          {fu.status==='Completed'&&!fu.outcome&&<input placeholder="WHAT WAS THE OUTCOME?" onBlur={e=>{if(e.target.value.trim())updateFU(fu.id,{outcome:e.target.value.toUpperCase()});}} style={{width:'100%',background:'#0A0A0A',border:'1px solid #252525',borderRadius:'7px',padding:'8px 12px',color:'#F5F0E8',fontSize:'13px',outline:'none',boxSizing:'border-box',fontFamily:'inherit',textTransform:'uppercase',marginTop:'8px'}}/>}
          {fu.outcome&&<div style={{fontSize:'11px',color:gold,textTransform:'uppercase',fontWeight:'700',marginTop:'6px'}}>OUTCOME: {fu.outcome}</div>}
        </div>;})}
    </div>}
  </div>;
}

// ─── CRM TAB ───────────────────────────────────────────────────
function CRMTab(){
  const[salespeople,setSalespeople]=useState([]);const[prospects,setProspects]=useState([]);const[followUps,setFollowUps]=useState([]);const[crmTab,setCrmTab]=useState('dashboard');const[tick,setTick]=useState(0);
  useEffect(()=>{Promise.all([get('salespeople','?order=created_at.asc'),get('prospects','?order=updated_at.desc'),get('follow_ups','?order=next_follow_up_date.asc')]).then(([sp,pr,fu])=>{setSalespeople(Array.isArray(sp)?sp:[]);setProspects(Array.isArray(pr)?pr:[]);setFollowUps(Array.isArray(fu)?fu:[]);});},[tick]);
  const refresh=()=>setTick(t=>t+1);
  const CRM_TABS=[{id:'dashboard',label:'DASHBOARD'},{id:'prospects',label:`PROSPECTS`},{id:'salespeople',label:'SALESPEOPLE'},{id:'followup',label:'FOLLOW-UPS'}];
  return <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 70px)'}}>
    <div style={{borderBottom:'1px solid #1A1A1A',background:'#0A0A0A',flexShrink:0}}><div style={{maxWidth:'680px',margin:'0 auto',display:'flex',overflowX:'auto',padding:'0 16px'}}>{CRM_TABS.map(t=><button key={t.id} onClick={()=>setCrmTab(t.id)} style={{background:'transparent',border:'none',borderBottom:crmTab===t.id?`2px solid ${gold}`:'2px solid transparent',color:crmTab===t.id?gold:'#444',padding:'10px 14px',fontSize:'11px',fontWeight:'700',cursor:'pointer',whiteSpace:'nowrap',fontFamily:'inherit',textTransform:'uppercase',minHeight:'44px'}}>{t.label}</button>)}</div></div>
    <div style={{flex:1,overflowY:'auto'}}>
      {crmTab==='dashboard'&&<DashboardTab prospects={prospects} salespeople={salespeople} followUps={followUps}/>}
      {crmTab==='prospects'&&<ProspectsTab salespeople={salespeople} onRefresh={refresh}/>}
      {crmTab==='salespeople'&&<SalespeopleTab salespeople={salespeople} setSalespeople={setSalespeople} prospects={prospects}/>}
      {crmTab==='followup'&&<FollowUpTab/>}
    </div>
  </div>;
}

// ─── DIAGNOSTIC ────────────────────────────────────────────────
const DIAG_PROMPT=`You are the full Melrose House creative agency team. Research businesses and produce diagnostic reports.
Use web search. Find: website, Instagram, Facebook, TikTok, Google Business Profile.
Every platform returns every base field. Null if not found. Last post date always MM-DD-YYYY. Never say likely, probably, may, might, appears to.
GREEN = clear gaps. YELLOW = partial presence. RED = well established.
Return RAW JSON ONLY. No markdown, no backticks, no preamble.
{"businessName":"exact name","businessType":"specific type","whatWeFound":"2-3 sentences real numbers real dates","googleDriveFolderName":"[Business Name] — [Business Type] — [today YYYY-MM-DD]","contactInfo":{"name":null,"phone":null,"email":null,"address":null},"prospectScore":{"color":"green or yellow or red","headline":"punchy sentence","reason":"2-3 sentences"},"platformPresence":[{"platform":"Instagram","found":true,"handle":null,"followers":null,"postCount":null,"lastPostDate":null,"postingFrequency":null,"status":"Active or Inactive","bioText":null,"linkInBio":null,"reelsPresent":null},{"platform":"Facebook","found":true,"handle":null,"followers":null,"postCount":null,"lastPostDate":null,"postingFrequency":null,"status":"Active or Inactive","pageLikes":null,"facebookReviewCount":null,"facebookRating":null},{"platform":"TikTok","found":false,"handle":null,"followers":null,"postCount":null,"lastPostDate":null,"postingFrequency":null,"status":"Not Found","videoCount":null},{"platform":"Google Business Profile","found":true,"handle":null,"followers":null,"postCount":null,"lastPostDate":null,"postingFrequency":null,"status":"Claimed or Unclaimed","claimed":null,"reviewCount":null,"averageRating":null,"totalPhotos":null,"gbpPostsActive":null,"lastGbpPostDate":null,"productsOrServicesListed":null,"descriptionPresent":null},{"platform":"Website","found":true,"handle":null,"followers":null,"postCount":null,"lastPostDate":null,"postingFrequency":null,"status":"Active or Outdated","sslActive":null,"mobileFriendly":null,"hasBookingOrContact":null}],"painPoints":["specific","specific","specific"],"missingOnline":["specific","specific","specific"],"gbpGaps":["specific","specific","specific"],"contentGapsByPlatform":[{"platform":"Instagram","gaps":["gap","gap"]},{"platform":"Facebook","gaps":["gap","gap"]},{"platform":"TikTok","gaps":["gap","gap"]},{"platform":"Google Business Profile","gaps":["gap","gap"]}],"recommendations":[{"rank":1,"service":"name","reason":"detailed specific reason","price":"price","isTopPick":true},{"rank":2,"service":"name","reason":"reason","price":"price","isTopPick":false},{"rank":3,"service":"name","reason":"reason","price":"price","isTopPick":false},{"rank":4,"service":"name","reason":"reason","price":"price","isTopPick":false},{"rank":5,"service":"name","reason":"reason","price":"price","isTopPick":false}],"prospectMessage":"Natural human text under 3 sentences referencing something real.","claudiaBuildPrompt":null}
SERVICE MENU: Glow Up Launch $397/Monthly $697/Growth $1197. GBP $47-97. Website from $397 care $47/mo. Reels $47-697. Images $37-350. Carousels $47-297. ManyChat. Brevo. Voice Agent.
For GREEN populate claudiaBuildPrompt with full Claudia build prompt. For YELLOW/RED set null.`;

function DiagnosticTab(){
  const[biz,setBiz]=useState('');const[url,setUrl]=useState('');const[result,setResult]=useState(null);const[loading,setLoading]=useState(false);const[status,setStatus]=useState('');const[error,setError]=useState(null);const[saved,setSaved]=useState(false);const[emailAddr,setEmailAddr]=useState('Tiffany@tiffanymd.com');const[showEmail,setShowEmail]=useState(false);const[copiedReport,setCopiedReport]=useState(false);
  const run=async()=>{
    if(!biz.trim()||!url.trim())return;setLoading(true);setError(null);setResult(null);setSaved(false);
    const steps=['SEARCHING THE WEB...','READING THEIR PAGES...','CHECKING EACH PLATFORM...','AUDITING THEIR GBP...','BUILDING YOUR REPORT...'];
    let si=0;setStatus(steps[0]);const iv=setInterval(()=>{si=(si+1)%steps.length;setStatus(steps[si]);},3000);
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4000,system:DIAG_PROMPT,tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:`Business name: ${biz}\nOnline presence: ${url}\n\nSearch right now. Get exact dates. Return JSON only.`}]})});
      const data=await res.json();const text=data.content?.find(b=>b.type==='text')?.text||'';
      const match=text.replace(/```json|```/g,'').trim().match(/\{[\s\S]*\}/);if(!match)throw new Error('No JSON');
      setResult(JSON.parse(match[0]));
    }catch(e){setError("COULDN'T PULL THE REPORT. CHECK THE INFO AND TRY AGAIN.");}
    finally{clearInterval(iv);setLoading(false);setStatus('');}
  };
  const saveToCRM=async()=>{
    if(!result)return;
    const r=await ins('prospects',{business_name:result.businessName?.toUpperCase()||'',business_type:result.businessType?.toUpperCase()||'',score_color:result.prospectScore?.color||'',score_headline:result.prospectScore?.headline||'',status:'New Lead',contact_name:result.contactInfo?.name?.toUpperCase()||'',contact_phone:result.contactInfo?.phone||'',contact_email:result.contactInfo?.email||'',address:result.contactInfo?.address?.toUpperCase()||'',website:result.platformPresence?.find(p=>p.platform==='Website')?.handle||'',instagram:result.platformPresence?.find(p=>p.platform==='Instagram')?.handle||'',facebook:result.platformPresence?.find(p=>p.platform==='Facebook')?.handle||'',diagnostic_json:JSON.stringify(result),pitched_services:result.recommendations?.[0]?[result.recommendations[0].service]:[],created_at:nowISO(),updated_at:nowISO()});
    if(r){if(result.painPoints?.length)await ins('log_entries',{prospect_id:r.id,category:'General',content:`DIAGNOSTIC PAIN POINTS:\n${result.painPoints.map((pp,i)=>`${i+1}. ${pp}`).join('\n')}\n\nMISSING ONLINE:\n${(result.missingOnline||[]).map((m,i)=>`${i+1}. ${m}`).join('\n')}`,author_name:'DIAGNOSTIC',created_at:nowISO()});if(result.googleDriveFolderName)await ins('log_entries',{prospect_id:r.id,category:'General',content:`GOOGLE DRIVE FOLDER: ${result.googleDriveFolderName}`,author_name:'DIAGNOSTIC',created_at:nowISO()});setSaved(true);}
  };
  const exportText=()=>[`THE PROSPECTING SUITE — DIAGNOSTIC`,'='.repeat(44),`BUSINESS: ${result?.businessName}`,`TYPE: ${result?.businessType}`,`SCORE: ${result?.prospectScore?.color?.toUpperCase()}`,result?.prospectScore?.headline||'','',`WHAT WE FOUND`,result?.whatWeFound||'','',`PAIN POINTS`,...(result?.painPoints?.map((p,i)=>`${i+1}. ${p}`)||[]),'',`TOP 5 RECOMMENDATIONS`,...(result?.recommendations?.map(r=>`${r.rank}. ${r.service}${r.isTopPick?' ★':''} — ${r.price}\n   ${r.reason}`)||[]),'',`PROSPECT MESSAGE`,`"${result?.prospectMessage}"`,'','— THE PROSPECTING SUITE | ONYX SAND GROUP'].join('\n');
  const score=result?.prospectScore;const scoreColor=score?SCORE_C[score.color]:null;
  return <div style={{maxWidth:'680px',margin:'0 auto',padding:'20px 16px 100px'}}>
    <Card style={{marginBottom:'14px'}}><Fi label="BUSINESS NAME" value={biz} onChange={setBiz} placeholder="E.G. GWENETTE HOME FURNITURE"/><Fi label="ONLINE PRESENCE" value={url} onChange={setUrl} placeholder="INSTAGRAM, WEBSITE, GOOGLE BUSINESS PROFILE — DROP WHATEVER THEY HAVE" multiline/><Btn onClick={run} disabled={loading||!biz.trim()||!url.trim()} full>{loading?status:'RUN DIAGNOSTIC →'}</Btn></Card>
    {error&&<div style={{background:'#160808',border:'1px solid #3A1414',borderRadius:'10px',padding:'13px 16px',color:'#FF6B6B',fontSize:'13px',marginBottom:'12px',textTransform:'uppercase'}}>{error}</div>}
    {result&&<div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
      <Card style={{border:`1px solid ${gold}33`}}><Lbl color={gold}>DIAGNOSTIC REPORT</Lbl><div style={{fontSize:'19px',fontWeight:'800',marginBottom:'2px',textTransform:'uppercase'}}>{result.businessName}</div><div style={{fontSize:'12px',color:'#555',marginBottom:'14px',textTransform:'uppercase'}}>{result.businessType}</div><div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}><Btn variant="green" small onClick={saveToCRM} disabled={saved}>{saved?'✓ SAVED TO CRM':'SAVE TO CRM'}</Btn><button onClick={()=>{navigator.clipboard.writeText(exportText());setCopiedReport(true);setTimeout(()=>setCopiedReport(false),2000);}} style={{background:copiedReport?`${gold}22`:'transparent',border:`1px solid ${gold}44`,borderRadius:'6px',padding:'6px 12px',fontSize:'11px',fontWeight:'700',color:gold,cursor:'pointer',textTransform:'uppercase',minHeight:'36px'}}>{copiedReport?'✓ COPIED':'COPY REPORT'}</button><button onClick={()=>setShowEmail(v=>!v)} style={{background:'transparent',border:'1px solid #2A2A2A',borderRadius:'6px',padding:'6px 12px',fontSize:'11px',fontWeight:'700',color:'#888',cursor:'pointer',textTransform:'uppercase',minHeight:'36px'}}>EMAIL →</button></div>{showEmail&&<div style={{display:'flex',gap:'8px',marginTop:'10px'}}><input type="email" value={emailAddr} onChange={e=>setEmailAddr(e.target.value)} style={{flex:1,background:'#0A0A0A',border:'1px solid #252525',borderRadius:'7px',padding:'9px 12px',color:'#F5F0E8',fontSize:'14px',outline:'none'}}/><Btn small onClick={()=>{const s=encodeURIComponent(`DIAGNOSTIC — ${result.businessName}`);const b=encodeURIComponent(exportText());window.open(`mailto:${emailAddr}?subject=${s}&body=${b}`);}}>SEND</Btn></div>}</Card>
      {result.contactInfo&&<Card><Lbl>CONTACT INFORMATION</Lbl><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px 16px'}}><NullRow label="NAME" value={result.contactInfo.name}/><NullRow label="PHONE" value={result.contactInfo.phone}/><NullRow label="EMAIL" value={result.contactInfo.email}/><NullRow label="ADDRESS" value={result.contactInfo.address}/></div></Card>}
      {score&&<div style={{background:score.color==='green'?'#070E09':score.color==='yellow'?'#120D06':'#120808',border:`1px solid ${scoreColor}33`,borderRadius:'14px',padding:'16px',position:'relative',overflow:'hidden'}}><div style={{position:'absolute',top:0,left:0,right:0,height:'3px',background:scoreColor}}/><div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'8px'}}><ScoreBadge color={score.color}/><div><Lbl color={scoreColor}>PROSPECT SCORE</Lbl><div style={{fontSize:'15px',fontWeight:'800',lineHeight:'1.3',textTransform:'uppercase'}}>{score.headline}</div></div></div><div style={{fontSize:'13px',color:'#A0988A',lineHeight:'1.6',paddingLeft:'48px'}}>{score.reason}</div></div>}
      <Card><Lbl>WHAT WE FOUND</Lbl><div style={{fontSize:'13px',color:'#A0988A',lineHeight:'1.65'}}>{result.whatWeFound}</div></Card>
      <div style={{background:'#0E0E0E',border:'1px solid #1E1E1E',borderRadius:'14px',padding:'16px'}}><Lbl>PLATFORM PRESENCE</Lbl><div style={{display:'flex',flexDirection:'column',gap:'10px'}}>{result.platformPresence?.map((p,i)=>{const accent=PC[p.platform]||'#888';const icon=PI[p.platform]||'?';return <div key={i} style={{background:'#0A0A0A',border:`1px solid ${p.found?accent+'33':'#1E1E1E'}`,borderRadius:'10px',padding:'12px'}}><div style={{display:'flex',gap:'10px',alignItems:'flex-start'}}><div style={{minWidth:'32px',height:'32px',background:p.found?`${accent}18`:'#1A1A1A',border:`1px solid ${p.found?accent+'44':'#2A2A2A'}`,borderRadius:'7px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'8px',fontWeight:'800',color:p.found?accent:'#333',flexShrink:0}}>{icon}</div><div style={{flex:1}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:'7px'}}><span style={{fontSize:'12px',fontWeight:'700',color:p.found?'#F5F0E8':'#444',textTransform:'uppercase'}}>{p.platform}</span><span style={{fontSize:'9px',fontWeight:'700',color:p.found?(['Active','Claimed'].includes(p.status)?'#00C48C':'#FF9F43'):'#333',background:p.found?(['Active','Claimed'].includes(p.status)?'#00C48C18':'#FF9F4318'):'#1A1A1A',border:`1px solid ${p.found?(['Active','Claimed'].includes(p.status)?'#00C48C33':'#FF9F4333'):'#2A2A2A'}`,borderRadius:'4px',padding:'2px 7px',textTransform:'uppercase'}}>{p.status}</span></div>{p.found?<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'3px 14px'}}><NullRow label="HANDLE" value={p.handle}/><NullRow label="FOLLOWERS" value={p.followers}/><NullRow label="POSTS" value={p.postCount}/><NullRow label="LAST POST" value={p.lastPostDate}/><NullRow label="FREQUENCY" value={p.postingFrequency}/>{p.platform==='Google Business Profile'&&<><NullRow label="REVIEWS" value={p.reviewCount}/><NullRow label="RATING" value={p.averageRating}/><NullRow label="PHOTOS" value={p.totalPhotos}/></>}{p.platform==='Website'&&<><NullRow label="SSL" value={p.sslActive}/><NullRow label="MOBILE" value={p.mobileFriendly}/></>}</div>:<div style={{fontSize:'11px',color:'#333',fontStyle:'italic',textTransform:'uppercase'}}>NO PRESENCE FOUND</div>}</div></div></div>;})} </div></div>
      <div style={{background:'#120808',border:'1px solid #FF6B6B1A',borderRadius:'14px',padding:'16px'}}><Lbl color="#FF6B6B">TOP PAIN POINTS</Lbl>{result.painPoints?.map((item,i)=><div key={i} style={{display:'flex',gap:'9px',alignItems:'flex-start',marginBottom:i<result.painPoints.length-1?'9px':0}}><div style={{minWidth:'19px',height:'19px',background:'#FF6B6B18',border:'1px solid #FF6B6B33',borderRadius:'5px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'9px',fontWeight:'800',color:'#FF6B6B',marginTop:'2px'}}>{i+1}</div><div style={{fontSize:'13px',color:'#A0988A',lineHeight:'1.55'}}>{item}</div></div>)}</div>
      <div style={{background:'#0A0814',border:'1px solid #A29BFE1A',borderRadius:'14px',padding:'16px'}}><Lbl color="#A29BFE">CONTENT GAPS BY PLATFORM</Lbl><div style={{display:'flex',flexDirection:'column',gap:'12px'}}>{result.contentGapsByPlatform?.map((plat,i)=>{const accent=PC[plat.platform]||'#A29BFE';return <div key={i}><div style={{fontSize:'10px',fontWeight:'700',color:accent,marginBottom:'6px',letterSpacing:'1px',textTransform:'uppercase'}}>{plat.platform}</div>{plat.gaps?.map((gap,j)=><div key={j} style={{display:'flex',gap:'8px',alignItems:'flex-start',marginBottom:j<plat.gaps.length-1?'5px':0}}><div style={{minWidth:'5px',height:'5px',background:accent,borderRadius:'50%',marginTop:'7px',flexShrink:0}}/><div style={{fontSize:'13px',color:'#A0988A',lineHeight:'1.5'}}>{gap}</div></div>)}</div>;})} </div></div>
      <div style={{background:'#070E09',border:'1px solid #00C48C1A',borderRadius:'14px',padding:'16px'}}><Lbl color="#00C48C">TOP 5 SERVICES TO SELL</Lbl><div style={{display:'flex',flexDirection:'column',gap:'10px'}}>{result.recommendations?.map((rec,i)=><div key={i} style={{background:rec.isTopPick?'linear-gradient(135deg,#0A1E0C,#0D240F)':'#0A1A0C',border:rec.isTopPick?`1px solid ${gold}55`:'1px solid #122414',borderRadius:'10px',padding:'13px',position:'relative',overflow:'hidden'}}>{rec.isTopPick&&<div style={{position:'absolute',top:0,left:0,right:0,height:'2px',background:`linear-gradient(90deg,${gold},${gl})`}}/>}<div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'8px',marginBottom:'4px'}}><div style={{display:'flex',alignItems:'center',gap:'6px'}}><span style={{fontSize:'9px',fontWeight:'800',color:rec.isTopPick?gold:'#333',textTransform:'uppercase'}}>#{rec.rank}</span><span style={{fontSize:'13px',fontWeight:'700',textTransform:'uppercase'}}>{rec.service}</span>{rec.isTopPick&&<span style={{background:`${gold}22`,border:`1px solid ${gold}44`,borderRadius:'3px',padding:'1px 6px',fontSize:'8px',fontWeight:'800',color:gold,textTransform:'uppercase'}}>TOP PICK</span>}</div><span style={{background:'#00C48C18',border:'1px solid #00C48C33',borderRadius:'4px',padding:'2px 8px',fontSize:'10px',fontWeight:'800',color:'#00C48C',whiteSpace:'nowrap'}}>{rec.price}</span></div><div style={{fontSize:'12px',color:rec.isTopPick?'#A0988A':'#555',lineHeight:'1.5',paddingLeft:'22px'}}>{rec.reason}</div></div>)}</div></div>
      <div style={{background:'#080810',border:'1px solid #1A1A35',borderRadius:'14px',padding:'16px'}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}><Lbl color="#A29BFE">READY-TO-SEND MESSAGE</Lbl><CopyBtn text={result.prospectMessage||''} small/></div><div style={{background:'#06060E',border:'1px solid #12122A',borderRadius:'9px',padding:'13px',fontSize:'15px',color:'#B8B0A0',lineHeight:'1.65',fontStyle:'italic'}}>"{result.prospectMessage}"</div></div>
      {score?.color==='green'&&result.googleDriveFolderName&&<Card style={{border:`1px solid ${gold}33`}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}><Lbl color={gold}>GOOGLE DRIVE FOLDER NAME</Lbl><CopyBtn text={result.googleDriveFolderName} small/></div><div style={{background:'#0A0A0A',border:'1px solid #1E1E1E',borderRadius:'7px',padding:'10px 12px',fontSize:'12px',color:'#C0B8A8',fontFamily:'monospace',textTransform:'uppercase'}}>{result.googleDriveFolderName}</div></Card>}
      {score?.color==='green'&&result.claudiaBuildPrompt&&<div style={{background:'#0A0814',border:`1px solid ${gold}44`,borderRadius:'14px',padding:'16px',position:'relative',overflow:'hidden'}}><div style={{position:'absolute',top:0,left:0,right:0,height:'3px',background:`linear-gradient(90deg,${gold},${gl})`}}/><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}><div><Lbl color={gold}>CLAUDIA BUILD PROMPT</Lbl><div style={{fontSize:'11px',color:'#555',textTransform:'uppercase',marginTop:'-4px'}}>PASTE INTO A NEW CLAUDE CHAT</div></div><CopyBtn text={result.claudiaBuildPrompt} small/></div><div style={{background:'#06060E',border:'1px solid #12122A',borderRadius:'9px',padding:'12px',fontSize:'11px',color:'#555',lineHeight:'1.7',fontFamily:'monospace',maxHeight:'160px',overflowY:'auto',whiteSpace:'pre-wrap'}}>{result.claudiaBuildPrompt}</div></div>}
    </div>}
  </div>;
}

        <div style={{display:'flex'}}>{[{id:'diagnostic',label:'🔍 DIAGNOSTIC'},{id:'crm',label:'📋 CRM'}].map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:'transparent',border:'none',borderBottom:tab===t.id?`2px solid ${gold}`:'2px solid transparent',color:tab===t.id?gold:'#444',padding:'10px',fontSize:'12px',fontWeight:'700',cursor:'pointer',fontFamily:'inherit',textTransform:'uppercase',minHeight:'44px'}}>{t.label}</button>)}</div>
